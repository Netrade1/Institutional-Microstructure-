name: Smart L2 and candle sweep research tests
on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'tests/**'
      - 'examples/**'
      - 'pine/**'
      - '.github/workflows/smart-l2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q integrations tests
      - name: Run detection and read-only integration tests
        run: python -m unittest discover -s tests -v
      - name: Replay labeled synthetic candles
        run: python -m integrations.sweep_research --input examples/synthetic_sweep_bars.jsonl --out reports/local/ci_sweep_evidence.jsonl --symbol SYNTH --source synthetic-fixture --timeframe-seconds 60
